      <stop offset="0%" stop-color="#e8edf5" />
      <stop offset="100%" stop-color="#d5dce6" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#8b7eff" />
